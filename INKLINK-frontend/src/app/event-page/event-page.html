<div class="page-wrapper">
    <section class="events-hero">
        <div class="container">
            <div class="row align-items-center gy-4">
                <div class="col-12 col-md-7 order-2 order-md-1 text-center text-md-start">
                    <h1 class="events-hero-title">Events & Kits</h1>
                    <p class="events-hero-sub">
                        Professional print packages designed for every occasion. <br />
                        From cultural festivals to corporate launches — we print it all.
                    </p>
                    <p class="events-hero-rating">8.2/10 Rating from our clients</p>
                </div>
                <div class="col-12 col-md-5 order-1 order-md-2 d-flex justify-content-center justify-content-md-end">
                    <div class="hero-img-wrap">
                        <img src="assets/images/atelier.png" alt="atelier" class="atelier-img" />
                    </div>
                </div>
            </div>
        </div>
    </section>

    <nav class="breadcrumb-nav" aria-label="breadcrumb">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a routerLink="/">Home</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Events</li>
            </ol>
        </div>
    </nav>

    <app-search-bar></app-search-bar>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="section-spacer"></div>
            </div>
        </div>

        <div class="row" *ngFor="let collection of collections">
            <div class="col-12">
                <h2 class="collection-title">
                    {{ collection.name }}
                </h2>

                <div class="collection-card">
                    <div class="row align-items-end justify-content-center g-3">
                        <ng-container *ngIf="getVisibleEvents(collection) as visibleEvents">
                            <div class="col-6 col-md-3 col-lg-3">
                                <button
                                    type="button"
                                    class="side-card"
                                    (click)="selectEvent(collection, visibleEvents[0])"
                                >
                                    <img
                                        [src]="visibleEvents[0].image"
                                        [alt]="visibleEvents[0].title"
                                        class="side-img w-100"
                                    />
                                    <p class="side-name">
                                        {{ visibleEvents[0].title }}
                                    </p>
                                    <p class="side-price">
                                        {{ visibleEvents[0].price }}.00 dt
                                    </p>
                                </button>
                            </div>

                            <div class="col-12 col-md-5 col-lg-4">
                                <div class="center-card text-center">
                                    <img
                                        [src]="visibleEvents[1].image"
                                        [alt]="visibleEvents[1].title"
                                        class="center-img w-100"
                                    />
                                    <p class="center-tag">
                                        {{ visibleEvents[1].title }}
                                    </p>
                                    <p class="center-price">
                                        {{ visibleEvents[1].price }}.00 dt
                                    </p>
                                    <button
                                        type="button"
                                        class="btn-see-more"
                                        [class.cta-pulse]="ctaPulseByCollection[collection.name]"
                                        (click)="openSelectedEvent(collection)"
                                    >
                                        See more
                                    </button>
                                </div>
                            </div>

                            <div class="col-6 col-md-3 col-lg-3">
                                <button
                                    type="button"
                                    class="side-card"
                                    (click)="selectEvent(collection, visibleEvents[2])"
                                >
                                    <img
                                        [src]="visibleEvents[2].image"
                                        [alt]="visibleEvents[2].title"
                                        class="side-img w-100"
                                    />
                                    <p class="side-name">
                                        {{ visibleEvents[2].title }}
                                    </p>
                                    <p class="side-price">
                                        {{ visibleEvents[2].price }}.00 dt
                                    </p>
                                </button>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>

            <div class="section-spacer"></div>
        </div>
    </div>

    <app-partners></app-partners>
</div>
